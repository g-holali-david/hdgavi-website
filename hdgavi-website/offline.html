<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0F1A;color:#CBD5E1;font-family:'DM Sans',system-ui,-apple-system,sans-serif;padding:24px}
.offline{text-align:center;max-width:420px}
.offline h1{font-family:Outfit,sans-serif;font-size:1.8rem;color:#F1F5F9;margin-bottom:12px}
.offline p{line-height:1.6;margin-bottom:24px;font-size:0.95rem}
.offline button{background:rgba(6,182,212,0.15);color:#06B6D4;border:1px solid rgba(6,182,212,0.3);padding:12px 28px;border-radius:8px;font-size:0.9rem;cursor:pointer;font-family:inherit;transition:background .2s}
.offline button:hover{background:rgba(6,182,212,0.25)}
.icon{font-size:3rem;margin-bottom:16px}
</style>
</head>
<body>
<div class="offline">
<div class="icon">&#x1F4F6;</div>
<h1>You're offline</h1>
<p>It looks like you've lost your internet connection. Please check your network and try again.</p>
<button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
