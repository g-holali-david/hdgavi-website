<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1E1B" media="(prefers-color-scheme: dark)">
<title>Hors ligne / Offline — Holali David GAVI</title>
<style>
/* Served by the service worker when the network is unavailable: no fonts or other files to fetch. */
:root{
  --paper:#F8F7F3;--ink:#1C1C1A;--ink-2:#46453F;--rule:#DAD7CF;
  --accent:#2A5878;--accent-hover:#1E4460;--on-accent:#FFFFFF;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#1F1E1B;--ink:#ECE6DA;--ink-2:#C8C1B3;--rule:#3A3833;--accent:#93B6D2;--accent-hover:#B9D0E2;--on-accent:#16222B;color-scheme:dark}
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
.page{width:min(36rem,calc(100% - 2rem));margin:0 auto;padding:clamp(2.5rem,12vh,7rem) 0 3rem}
.brand{padding-bottom:1rem;border-bottom:1px solid var(--rule);font-family:var(--serif);font-weight:500;font-size:1.125rem;line-height:1.2}
.caps{letter-spacing:.04em}
h1{margin-top:2.5rem;font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.15;letter-spacing:-.01em}
h2{margin-top:2rem;font-family:var(--serif);font-weight:500;font-size:1.25rem;line-height:1.25}
h1 + p,h2 + p{margin-top:.6rem;max-width:34rem}
.en{color:var(--ink-2)}
button{margin-top:2.25rem;min-height:2.75rem;padding:0 1.125rem;border:1px solid var(--accent);border-radius:2px;background:var(--accent);color:var(--on-accent);font:500 1rem/1.2 var(--sans);cursor:pointer}
button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:760px){
  body{font-size:1rem}
  h1{font-size:1.75rem}
}
</style>
</head>
<body>
<main class="page">
  <p class="brand">Holali David <span class="caps">GAVI</span></p>

  <h1>Vous êtes hors ligne</h1>
  <p>Cette page n’a pas pu être chargée&nbsp;: la connexion à Internet semble interrompue. Vérifiez votre réseau, puis réessayez.</p>

  <div lang="en" class="en">
    <h2>You are offline</h2>
    <p>This page could not be loaded: the Internet connection seems to be down. Check your network, then try again.</p>
  </div>

  <button type="button" id="retry">Réessayer <span lang="en">/ Try again</span></button>
</main>
<script>
document.getElementById('retry').addEventListener('click', function () { location.reload(); });
window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
